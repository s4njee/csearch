name: Repo Hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - freya
      - cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run repo hygiene checks
        run: bash scripts/check-repo-hygiene.sh
