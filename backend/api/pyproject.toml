[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csearch-api-fastapi"
version = "0.1.0"
description = "FastAPI rewrite of the CSearch read API"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "openai>=1.0.0",
  "prometheus-client>=0.20.0",
  "pydantic-settings>=2.3.0",
  "redis>=5.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes (F), isort (I), pyupgrade (UP), bugbear (B), plus a subset of
# pycodestyle (E/W). E501 (line length) is disabled — route signatures with
# multiple Depends() params are intentionally long.
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Body",
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
# Pragmatic baseline: catch real type errors without forcing full annotation
# coverage on an existing codebase.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

