apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: csearch
  annotations:
    # freya is applied by hand (no Argo running on the cluster), so these hook
    # annotations are inert here — re-run with:
    #   kubectl --context freya -n default delete job db-migrate --ignore-not-found
    #   kubectl --context freya apply -k k8s/freya-db
    # migrate.py is idempotent, so re-running only applies what's pending.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: csearch
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: freya
      imagePullSecrets:
        - name: registry-s8njee-pull
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.s8njee.com/csearch-db-migrate:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-auth
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export PGHOST="$POSTGRES_RW_HOST"
              export PGUSER="$POSTGRES_USER"
              export PGDATABASE="$POSTGRES_DB"
              export PGPASSWORD="$POSTGRES_PASSWORD"
              until pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE"; do
                echo "waiting for postgres..."; sleep 2
              done
              python3 /db/migrate.py
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
