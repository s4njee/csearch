apiVersion: batch/v1
kind: CronJob
metadata:
  name: csearch-pipeline-v2
  labels:
    app.kubernetes.io/name: csearch-pipeline-v2
    app.kubernetes.io/component: data-pipeline
    app.kubernetes.io/part-of: csearch
spec:
  # First supervised run completed 2026-07-04: one-time convergence of the
  # seeded prod corpus onto f(corpus, current code) — 429 added / 219,442
  # reused / 56 deleted, exact-manifest verify, 5/5 invariants green.
  # Nightly runs from here are incremental (~zero plan on quiet days).
  suspend: false
  schedule: "30 5 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0            # fail-loud: a failed reconcile must stay failed
      template:
        metadata:
          labels:
            app.kubernetes.io/name: csearch-pipeline-v2
            app.kubernetes.io/component: data-pipeline
            app.kubernetes.io/part-of: csearch
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: freya   # corpus hostPath lives on this node
          imagePullSecrets:
            - name: registry-s8njee-pull
          securityContext:
            # The corpus hostPath is owned by uid 1000 (written by the v1
            # orchestrator, which runs as 1000) — match it or the fetcher
            # cannot update bill text.
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Scrape bills + votes (metadata, roll-calls, data_versions) into the
            # v2 DB and refresh the /congress-data source files, BEFORE the
            # reconcile container fetches text and embeds. Folded in from the v1
            # orchestrator (freya-scraper/orchestrator-cronjob.yaml) at the v2
            # cutover: previously v2 did only text+embeddings and relied on the
            # now-suspended v1 scraper to advance bills/votes/data_versions, so
            # the v2 DB (and the site's "data as of" date) went stale. Same
            # csearch-updater image and RUN_BILLS/RUN_VOTES flags as the v1
            # scraper; postgres-config/postgres-auth resolve to the v2 Postgres
            # because this Pod runs in the csearch-v2 namespace. Runs as an
            # initContainer so a scrape failure blocks the reconcile (fail-loud,
            # matching backoffLimit: 0).
            - name: scraper
              image: registry.s8njee.com/csearch-updater:latest
              imagePullPolicy: Always
              command: ["/usr/local/bin/docker-entrypoint.sh", "/usr/local/bin/updater"]
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
              env:
                - name: CONGRESSDIR
                  value: /srv/csearch
                - name: POSTGRESURI
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_RW_HOST
                - name: REDIS_URL
                  value: "redis://csearch-redis:6379"
                - name: LOG_LEVEL
                  value: "info"
                - name: DB_USER
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: POSTGRES_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_DB
                - name: RUN_BILLS
                  value: "true"
                - name: RUN_VOTES
                  value: "true"
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: congress-code
                  mountPath: /srv/csearch/congress
                - name: congress-data
                  mountPath: /srv/csearch/data
                - name: congress-data
                  mountPath: /srv/csearch/congress/data
          containers:
            - name: reconcile
              image: registry.s8njee.com/csearch-tarp-updater:latest
              imagePullPolicy: Always
              command:
                - /bin/bash
                - -ceu
                - |
                  export CONGRESS="${CONGRESS:-$(( ( $(date +%Y) - 1789 ) / 2 + 1 ))}"
                  export PG_CONNECTION_STRING="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}"
                  echo "--- fetch new bill text (same fetcher as v1) ---"
                  python fetcher.py --data-root "$CONGRESS_DATA_ROOT" --congresses "$CONGRESS" --workers 16
                  echo "--- declarative reconcile into the v2 corpus ---"
                  python reconciler.py --congress "$CONGRESS" --corpus-root "$DATA_DIR"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: CONGRESS_DATA_ROOT
                  value: /congress-data
                - name: DATA_DIR
                  value: /app/data
                - name: DB_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_RW_HOST
                - name: DB_USER
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: POSTGRES_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_DB
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: csearch-api-openai
                      key: OPENAI_API_KEY
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 8Gi
              volumeMounts:
                - name: congress-data
                  mountPath: /congress-data
                  readOnly: true
                - name: tarp-data
                  mountPath: /app/data
          volumes:
            # Code checkout the scraper (updater) needs on PATH; hostPath on freya.
            - name: congress-code
              hostPath:
                path: /home/sanjee/congress
                type: Directory
            # The scraped corpus is version-agnostic source data. The scraper
            # initContainer writes it (RW mount above); the reconcile container
            # reads it (readOnly mount above).
            - name: congress-data
              hostPath:
                path: /home/sanjee/congress/data
                type: DirectoryOrCreate
            - name: tarp-data
              hostPath:
                path: /home/sanjee/congress/data/tarp
                type: DirectoryOrCreate
