apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Schema mechanism ────────────────────────────────────────────────────────
# One path for every environment: the db-migrate Job runs db/migrate.py, which
# applies the db/migrations/ chain idempotently (bootstrap on an empty DB,
# pending-only on a live one). No more per-environment bootstrap ConfigMaps and
# no schema-drift check — see db/README.md. netcup additionally publishes its
# rows to freya via logical replication (db/replication/).
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - postgres-config.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - db-migrate-job.yaml
  - zip-districts-seed-job.yaml
  - postgres-b2-backup-cronjob.yaml

configMapGenerator:
  - name: postgres-backup-scripts
    files:
      - scripts/prune-b2-backups.sh

generatorOptions:
  disableNameSuffixHash: true
