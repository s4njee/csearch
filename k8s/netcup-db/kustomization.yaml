apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ── Database topology note (§7 docs/CRITICISMS2.md) ─────────────────────────
#
# ACTIVE topology: custom postgres-statefulset.yaml (referenced in resources).
#
# DORMANT manifests in this directory (NOT referenced here, NOT deployed):
#   - cnpg-cluster.yaml    — CloudNativePG HA cluster definition
#   - cnpg-pooler.yaml     — CloudNativePG PgBouncer pooler (type: rw)
# These are aspirational/experimental CNPG configs. They are kept here for
# reference but must not be applied without a planned migration to CNPG.
# TODO: either activate CNPG in both overlays or delete the dormant files.
#
# Schema divergence between environments (§7):
#   netcup (this file) bootstraps: 001-schema.sql + 003-zip-districts.sql
#   freya  bootstraps:             001-schema.sql + 002-audit-history.sql
# Both environments should converge to the same schema by running
# `python db/migrate.py` which applies all migrations 0000–current.
# Prefer the migration runner over per-environment ConfigMap SQL going forward.
# ─────────────────────────────────────────────────────────────────────────────

resources:
  - postgres-config.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - postgres-zip-districts-migration-job.yaml

configMapGenerator:
  - name: postgres-schema
    files:
      - 001-schema.sql
      - 003-zip-districts.sql

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: registry.s8njee.com/csearch-postgres
    newName: registry.s8njee.com/csearch-postgres
    newTag: latest
