apiVersion: batch/v1
kind: Job
metadata:
  name: zip-districts-seed
  labels:
    app.kubernetes.io/name: zip-districts-seed
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: csearch
  annotations:
    # Data seed (not schema) — the zip_districts table itself is created by
    # migration 0003. Runs after db-migrate. Loads the ~40k-row ZCTA→district
    # dataset only when the table is empty, so re-running on every sync is a
    # cheap no-op and never trips the primary key. netcup only: freya receives
    # zip_districts rows through logical replication (see db/replication/).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zip-districts-seed
        app.kubernetes.io/component: seed
        app.kubernetes.io/part-of: csearch
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: registry-s8njee-pull
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: registry.s8njee.com/csearch-db-migrate:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-auth
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export PGHOST="$POSTGRES_RW_HOST"
              export PGUSER="$POSTGRES_USER"
              export PGDATABASE="$POSTGRES_DB"
              export PGPASSWORD="$POSTGRES_PASSWORD"
              until pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE"; do
                echo "waiting for postgres..."; sleep 2
              done
              count="$(psql -tAqc 'SELECT count(*) FROM zip_districts')"
              if [ "$count" = "0" ]; then
                echo "seeding zip_districts..."
                psql -v ON_ERROR_STOP=1 -f /db/seed/zip_districts.sql
              else
                echo "zip_districts already has $count rows — skipping seed."
              fi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
