# Read-only PgBouncer Pooler for the CNPG HA cluster (§1 docs/CRITICISMS2.md).
#
# This routes all connections through the CNPG streaming replica, freeing the
# primary for scraper writes and NLP ingest while GET API traffic hits the
# replica.
#
# IMPORTANT: This manifest is DORMANT until the database is migrated from the
# custom postgres-statefulset.yaml to the CNPG cluster (cnpg-cluster.yaml).
# Do not add this to kustomization.yaml until that migration is complete.
# See k8s/netcup-db/kustomization.yaml for the current active topology.
#
# Once active, set READ_POSTGRESURI in the API deployment to point at the
# csearch-pooler-ro ClusterIP service so db.py routes GET reads to the replica.
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: csearch-pooler-ro
  namespace: default
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: read-replica-pooler
spec:
  cluster:
    name: pg-cluster
  # type: ro routes connections to streaming replicas only.
  # The primary is never used by this pooler.
  type: ro
  instances: 2
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "500"
      default_pool_size: "25"
      server_idle_timeout: "60"
