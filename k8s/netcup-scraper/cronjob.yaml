apiVersion: batch/v1
kind: CronJob
metadata:
  name: csearch-rscraper
  labels:
    app.kubernetes.io/name: csearch-updater
    app.kubernetes.io/component: scraper
spec:
  timeZone: "America/Chicago"
  # Second daily scrape — catches GovInfo posts that land after the 05:00 orchestrator
  # run. Pairs with csearch-data-pipeline (orchestrator-cronjob.yaml @ 0 5).
  schedule: "0 10 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: csearch-updater
            app.kubernetes.io/component: scraper
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: registry-s8njee-pull
          dnsConfig:
            options:
              - name: single-request-reopen
              - name: ndots
                value: "1"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: updater
              image: registry.s8njee.com/csearch-updater:latest
              imagePullPolicy: Always
              # Wrap the default entrypoint so we can fire the Cloudflare Pages
              # deploy hook on a successful scrape.
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  /usr/local/bin/docker-entrypoint.sh /usr/local/bin/updater
                  if [ -n "${DEPLOY_HOOK_URL:-}" ]; then
                    echo "Triggering Cloudflare Pages deploy..."
                    python - <<'PY'
                  import os, sys, time, urllib.request
                  url = os.environ["DEPLOY_HOOK_URL"]
                  for attempt in range(1, 4):
                      try:
                          req = urllib.request.Request(url, method="POST", data=b"")
                          with urllib.request.urlopen(req, timeout=30) as r:
                              print(f"Deploy hook attempt {attempt}: HTTP {r.status}")
                              sys.exit(0)
                      except Exception as e:
                          print(f"Deploy hook attempt {attempt} failed: {e}", file=sys.stderr)
                          time.sleep(5 * attempt)
                  print("Deploy hook exhausted retries; not failing the job.", file=sys.stderr)
                  PY
                  else
                    echo "DEPLOY_HOOK_URL not set; skipping deploy trigger."
                  fi
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
              env:
                - name: CONGRESSDIR
                  value: /srv/csearch
                - name: POSTGRESURI
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_RW_HOST
                - name: REDIS_URL
                  value: "redis://csearch-redis:6379"
                - name: LOG_LEVEL
                  value: "info"
                - name: DB_USER
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: POSTGRES_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_DB
                - name: RUN_BILLS
                  value: "true"
                - name: RUN_VOTES
                  value: "true"
                - name: DEPLOY_HOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: csearch-cloudflare-deploy-hook
                      key: DEPLOY_HOOK_URL
                      optional: true
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: congress-data
                  mountPath: /srv/csearch/data
                - name: congress-data
                  mountPath: /srv/csearch/congress/data
          volumes:
            - name: congress-data
              hostPath:
                path: /root/congress/data
                type: DirectoryOrCreate
