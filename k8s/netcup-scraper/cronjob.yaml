apiVersion: batch/v1
kind: CronJob
metadata:
  name: csearch-rscraper
  labels:
    app.kubernetes.io/name: csearch-updater
    app.kubernetes.io/component: scraper
spec:
  timeZone: "America/Chicago"
  # Daily scrape at 04:00 America/Chicago (DST-aware via timeZone above).
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: csearch-updater
            app.kubernetes.io/component: scraper
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: registry-s8njee-pull
          dnsConfig:
            options:
              - name: single-request-reopen
              - name: ndots
                value: "1"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: updater
              image: registry.s8njee.com/csearch-updater:8e74e595076d940bd3f897a03ae2f4a11d2a13e8
              imagePullPolicy: IfNotPresent
              # Plain entrypoint. (The Cloudflare Pages deploy-hook wrapper was
              # removed: the Pages project is direct-upload — deployed by
              # frontend-cloudflare-deploy.yml via `wrangler pages deploy` — so a
              # git-build deploy hook returns 500, and post-scrape freshness is
              # already handled by the Redis cache clear + the api-cache Worker.)
              command: ["/usr/local/bin/docker-entrypoint.sh", "/usr/local/bin/updater"]
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL
              env:
                - name: CONGRESSDIR
                  value: /srv/csearch
                - name: POSTGRESURI
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_RW_HOST
                - name: REDIS_URL
                  value: "redis://csearch-redis:6379"
                - name: LOG_LEVEL
                  value: "info"
                - name: DB_USER
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_USER
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: POSTGRES_PASSWORD
                - name: DB_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: postgres-config
                      key: POSTGRES_DB
                - name: RUN_BILLS
                  value: "true"
                - name: RUN_VOTES
                  value: "true"
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: congress-data
                  mountPath: /srv/csearch/data
                - name: congress-data
                  mountPath: /srv/csearch/congress/data
          volumes:
            - name: congress-data
              hostPath:
                path: /root/congress/data
                type: DirectoryOrCreate
