apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local k3s (node "mars") API + Redis. Bases on netcup-core but drops the
# netcup ingress (api.csearch.org / cert-manager / letsencrypt) and the two
# SealedSecrets — this cluster has no sealed-secrets controller, so the OpenAI
# and api secrets are created out-of-band as plain Secrets. The API is exposed
# on the LAN via a klipper LoadBalancer (see api-lb.yaml).
namespace: csearch

resources:
  - ../netcup-core
  - api-lb.yaml

images:
  - name: registry.s8njee.com/csearch-fastapi
    newName: registry.s8njee.com/csearch-fastapi
    newTag: latest

patches:
  - target:
      kind: Ingress
      name: csearch-api
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: csearch-api
  - target:
      group: bitnami.com
      kind: SealedSecret
      name: csearch-api-openai
    patch: |-
      $patch: delete
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: csearch-api-openai
  - target:
      group: bitnami.com
      kind: SealedSecret
      name: csearch-cloudflare-deploy-hook
    patch: |-
      $patch: delete
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: csearch-cloudflare-deploy-hook
