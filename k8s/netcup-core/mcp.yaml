apiVersion: apps/v1
kind: Deployment
metadata:
  name: csearch-mcp
  labels:
    app.kubernetes.io/name: csearch-mcp
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: csearch-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: csearch-mcp
        app.kubernetes.io/component: mcp
    spec:
      imagePullSecrets:
        - name: registry-s8njee-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: registry.s8njee.com/csearch-mcp@sha256:236026450ba19949009d68807c0be975be1018e4d9c3bdb473946ab9acc9d30e
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            # Talk to the API in-cluster (no public round-trip).
            - name: CSEARCH_API_BASE
              value: "http://csearch-api"
            - name: CSEARCH_SITE_BASE
              value: "https://csearch.org"
          # FastMCP's streamable-HTTP endpoint has no plain 200 health route
          # (GET /mcp is 406 by design), so probe the TCP socket instead.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: csearch-mcp
  labels:
    app.kubernetes.io/name: csearch-mcp
    app.kubernetes.io/component: mcp
spec:
  selector:
    app.kubernetes.io/name: csearch-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
