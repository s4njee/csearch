apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - redis.yaml
  - api.yaml
  - api-ingress.yaml
  - semantic-warmup-cronjob.yaml
  - mcp.yaml
  - mcp-ingress.yaml
  - csearch-api-openai-sealedsecret.yaml
  - csearch-cloudflare-deploy-hook-sealedsecret.yaml

images:
  - name: registry.s8njee.com/csearch-fastapi
    newName: registry.s8njee.com/csearch-fastapi
    newTag: latest
  - name: registry.s8njee.com/csearch-mcp
    newName: registry.s8njee.com/csearch-mcp
    newTag: latest
