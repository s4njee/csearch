# Cloudflare Pages deploy hook for csearch-frontend.
#
# This file is a PLACEHOLDER and is NOT yet listed in kustomization.yaml.
# Replace `encryptedData.DEPLOY_HOOK_URL` with a real sealed value, then add
# this file to k8s/freya-core/kustomization.yaml under `resources:`.
#
# One-shot create:
#
#   PROJECT_NAME=$(echo $CF_PAGES_PROJECT)
#   HOOK_URL=$(curl -fsSL -X POST \
#       -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
#       -H "Content-Type: application/json" \
#       "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deploy_hooks" \
#       -d '{"name":"scraper-success","branch":"main"}' \
#     | jq -r '.result.hook')
#
#   kubectl create secret generic csearch-cloudflare-deploy-hook \
#     --namespace=default \
#     --from-literal=DEPLOY_HOOK_URL="$HOOK_URL" \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-namespace=kube-system --format=yaml \
#   > k8s/freya-core/csearch-cloudflare-deploy-hook-sealedsecret.yaml
#
# After creating, add `- csearch-cloudflare-deploy-hook-sealedsecret.yaml`
# to `resources:` in the same directory's kustomization.yaml.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: csearch-cloudflare-deploy-hook
  namespace: default
spec:
  encryptedData:
    DEPLOY_HOOK_URL: REPLACE_ME_WITH_KUBESEAL_OUTPUT
  template:
    metadata:
      name: csearch-cloudflare-deploy-hook
      namespace: default
