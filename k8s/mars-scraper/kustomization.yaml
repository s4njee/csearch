apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local k3s (node "mars") scraper + NLP pipeline. Reuses the netcup-scraper
# CronJobs verbatim and only repoints the node-local hostPath volumes at
# /home/sanjee/congress (user-writable, uid 1000), so existing congress/data
# can be seeded on disk. Layout mirrors the freya overlay:
#   /home/sanjee/congress          -> congress code (repopulated by entrypoint)
#   /home/sanjee/congress/data      -> scraped data
#   /home/sanjee/congress/data/tarp -> NLP pipeline working data
namespace: csearch

resources:
  - ../netcup-scraper

images:
  - name: registry.s8njee.com/csearch-updater
    newName: registry.s8njee.com/csearch-updater
    newTag: latest
  - name: registry.s8njee.com/csearch-tarp-updater
    newName: registry.s8njee.com/csearch-tarp-updater
    newTag: latest

patches:
  # Second daily scrape (csearch-rscraper): only congress-data is a volume.
  - target:
      kind: CronJob
      name: csearch-rscraper
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/volumes
        value:
          - name: congress-data
            hostPath:
              path: /home/sanjee/congress/data
              type: DirectoryOrCreate
  # Orchestrator (csearch-data-pipeline): code + shared data + tarp on host.
  - target:
      kind: CronJob
      name: csearch-data-pipeline
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/volumes
        value:
          - name: congress-code
            hostPath:
              path: /home/sanjee/congress
              type: DirectoryOrCreate
          - name: congress-data
            hostPath:
              path: /home/sanjee/congress/data
              type: DirectoryOrCreate
          - name: tarp-data
            hostPath:
              path: /home/sanjee/congress/data/tarp
              type: DirectoryOrCreate
