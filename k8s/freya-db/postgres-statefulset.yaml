apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      nodeSelector:
        kubernetes.io/hostname: freya
      imagePullSecrets:
        - name: registry-s8njee-pull
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Pinned to a digest so the Debian/glibc base can't drift (the mutable
          # :pg18 tag slid 2.41→2.36 once and broke netcup's collation version).
          # Keep this in lockstep with k8s/netcup-db so the mirror matches.
          image: pgvector/pgvector:pg18@sha256:212765b63c1462883de295c4c415edcd22191b8d8d46853e86ad05d4b577a4cb
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-auth
          env:
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
          command:
            - /bin/bash
            - -ceu
            - |
              hba_file="${PGDATA}/pg_hba.conf"
              if [ -f "$hba_file" ] && ! grep -q "csearch freya pod replication" "$hba_file"; then
                {
                  echo ""
                  echo "# csearch freya pod replication backups"
                  echo "host replication ${POSTGRES_USER} 10.42.0.0/16 scram-sha-256"
                  echo "host replication ${POSTGRES_USER} 10.43.0.0/16 scram-sha-256"
                } >> "$hba_file"
              fi
              exec docker-entrypoint.sh postgres
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            # Schema comes from the db-migrate Job (db/migrate.py), not an initdb
            # ConfigMap — the single schema mechanism for bootstrap + migrations.
            # Prod row data (incl. zip_districts) then arrives via logical
            # replication from netcup. See db/README.md and db/replication/.
            - mountPath: /var/lib/postgresql/data
              name: postgres-data
            - mountPath: /dev/shm
              name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 30Gi
        storageClassName: local-path
