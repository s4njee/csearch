# Local development stack. One blessed path: `make dev` (or `docker compose up`).
# Postgres comes up already migrated and seeded via db/docker-initdb.sh, so the
# API and a fixture-backed semantic search work with no secrets.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: csearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d csearch"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "5433:5432"
    volumes:
      - ./db:/opt/db:ro
      - ./db/docker-initdb.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API Dockerfile copies paths relative to the repo root (it needs
  # backend/scraper/explore.sql), so the build context must be the repo root.
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      POSTGRESURI: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-postgres}
      DB_NAME: csearch
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Optional: set OPENAI_API_KEY in your shell to enable live semantic search.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3000:3000"

  scraper:
    build:
      context: .
      dockerfile: backend/scraper/Dockerfile
    profiles: ["ingest"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CONGRESSDIR: /srv/csearch
      POSTGRESURI: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-postgres}
      DB_NAME: csearch
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      RUN_BILLS: "true"
      RUN_VOTES: "true"
    volumes:
      - ./backend/scraper/congress:/srv/csearch/congress

  frontend:
    image: node:20-alpine
    working_dir: /app
    profiles: ["frontend"]
    environment:
      NUXT_API_SERVER: http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    command: >
      sh -c "npm install && npx nuxt dev --host 0.0.0.0 --port 80"
    depends_on:
      api:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  postgres_data:
